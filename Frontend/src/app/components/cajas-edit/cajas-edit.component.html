<h1 class="h4 mb-3">Actualizar Caja No. {{ user.id_caja }}</h1>

<div class="card">
  <div class="card-body">
    <form #f="ngForm" (ngSubmit)="updateUser(f)" [class.was-validated]="f.submitted" novalidate>
      <div class="row g-3">
        <div class="col-md-4 form-group">
          <label for="monto_dinero" class="form-label">Monto de dinero</label>
          <input type="number" id="monto_dinero" [(ngModel)]="user.monto_dinero" name="monto_dinero"
            class="form-control" min="0" step="0.01" required />
          <div class="invalid-feedback">Digite un monto mayor o igual a 0</div>
        </div>
      </div>
      <button type="submit" class="btn btn-success mt-3 me-2">Actualizar</button>
      <a routerLink="/cajas" class="btn btn-outline-secondary mt-3">Cancelar</a>
    </form>
  </div>
</div>
