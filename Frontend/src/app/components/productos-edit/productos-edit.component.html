<h1 class="h4 mb-3">Actualizar Producto No. {{ user.id_producto }}</h1>

<div class="card">
  <div class="card-body">
    <form #f="ngForm" (ngSubmit)="updateUser(f)" [class.was-validated]="f.submitted" novalidate>
      <div class="row g-3">
        <div class="col-md-4 form-group">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" [(ngModel)]="user.nombre" name="nombre" class="form-control" maxlength="100" required />
          <div class="invalid-feedback">Digite el nombre</div>
        </div>
        <div class="col-md-4 form-group">
          <label for="marca" class="form-label">Marca</label>
          <input type="text" id="marca" [(ngModel)]="user.marca" name="marca" class="form-control" maxlength="50" />
        </div>
        <div class="col-md-4 form-group">
          <label for="categoria" class="form-label">Categoría</label>
          <input type="text" id="categoria" [(ngModel)]="user.categoria" name="categoria" class="form-control" maxlength="50" required />
          <div class="invalid-feedback">Digite la categoría</div>
        </div>
        <div class="col-6 col-md-3 form-group">
          <label for="precio_compra" class="form-label">Precio compra</label>
          <input type="number" id="precio_compra" [(ngModel)]="user.precio_compra" name="precio_compra" class="form-control" min="0" step="0.01" required />
          <div class="invalid-feedback">Digite el precio</div>
        </div>
        <div class="col-6 col-md-3 form-group">
          <label for="precio_venta" class="form-label">Precio venta</label>
          <input type="number" id="precio_venta" [(ngModel)]="user.precio_venta" name="precio_venta" class="form-control" min="0" step="0.01" required />
          <div class="invalid-feedback">Digite el precio</div>
        </div>
        <div class="col-6 col-md-3 form-group">
          <label for="stock" class="form-label">Stock</label>
          <input type="number" id="stock" [(ngModel)]="user.stock" name="stock" class="form-control" min="0" step="1" required />
          <div class="invalid-feedback">Digite el stock</div>
        </div>
        <div class="col-6 col-md-3 form-group">
          <label for="stock_limite" class="form-label">Stock mínimo</label>
          <input type="number" id="stock_limite" [(ngModel)]="user.stock_limite" name="stock_limite" class="form-control" min="0" step="1" required />
          <div class="invalid-feedback">Digite el stock mínimo</div>
        </div>
        <div class="col-12 form-group">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" [(ngModel)]="user.descripcion" name="descripcion" rows="2" class="form-control"></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-success mt-3 me-2">Actualizar</button>
      <a routerLink="/productos" class="btn btn-outline-secondary mt-3">Cancelar</a>
    </form>
  </div>
</div>
