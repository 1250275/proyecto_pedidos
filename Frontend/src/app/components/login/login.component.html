<div class="row justify-content-center mt-5">
  <div class="col-12 col-sm-9 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 text-center mb-1">Sistema de Pedidos</h1>
        <p class="text-center text-muted mb-4">Inicie sesión para continuar</p>

        <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="IniciarSesion()" novalidate>
          <div class="form-group mb-3">
            <label for="nombre_usuario" class="control-label form-label">Usuario</label>
            <input
              type="text"
              id="nombre_usuario"
              [(ngModel)]="user.nombre_usuario"
              name="nombre_usuario"
              placeholder="DIGITE SU USUARIO"
              class="form-control"
              autocomplete="username"
              autofocus
            />
          </div>
          <div class="form-group mb-3">
            <label for="contrasena" class="control-label form-label">Contraseña</label>
            <input
              type="password"
              id="contrasena"
              [(ngModel)]="user.contrasena"
              name="contrasena"
              placeholder="DIGITE SU CONTRASEÑA"
              class="form-control"
              autocomplete="current-password"
            />
          </div>

          <div *ngIf="mensajeError" class="alert alert-warning py-2" role="alert">{{ mensajeError }}</div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
            {{ cargando ? 'Ingresando...' : 'Ingresar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
