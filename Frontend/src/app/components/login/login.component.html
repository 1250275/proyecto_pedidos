<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <h1 class="h4 fw-semibold mb-1">Sistema de Pedidos</h1>
      <p class="text-muted mb-0">Inicie sesión para continuar</p>
    </div>

    <form id="formulario" name="formulario" #f="ngForm" (ngSubmit)="IniciarSesion()" novalidate>
      <!-- Usuario -->
      <div class="mb-3">
        <label for="nombre_usuario" class="form-label">Usuario</label>
        <div class="input-group login-input">
          <span class="input-group-text" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            type="text"
            id="nombre_usuario"
            [(ngModel)]="user.nombre_usuario"
            name="nombre_usuario"
            placeholder="Digite su usuario"
            class="form-control"
            autocomplete="username"
            autofocus
          />
        </div>
      </div>

      <!-- Contraseña -->
      <div class="mb-2">
        <label for="contrasena" class="form-label">Contraseña</label>
        <div class="input-group login-input">
          <span class="input-group-text" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            [type]="mostrarContrasena ? 'text' : 'password'"
            id="contrasena"
            [(ngModel)]="user.contrasena"
            name="contrasena"
            placeholder="Digite su contraseña"
            class="form-control"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="btn toggle-password"
            (click)="mostrarContrasena = !mostrarContrasena"
            [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="mostrarContrasena"
          >
            <!-- Ojo (mostrar) -->
            <svg *ngIf="!mostrarContrasena" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Ojo tachado (ocultar) -->
            <svg *ngIf="mostrarContrasena" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
              <path d="M1 1l22 22"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="text-end mb-3">
        <a routerLink="/recuperar-contrasena" class="forgot-link">¿Ha olvidado su contraseña?</a>
      </div>

      <div *ngIf="mensajeError" class="alert alert-warning py-2 small" role="alert">{{ mensajeError }}</div>

      <button type="submit" class="btn login-btn w-100" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</div>
