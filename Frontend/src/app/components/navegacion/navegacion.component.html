<!-- Botón hamburguesa, solo en pantallas pequeñas -->
<button class="btn-hamburguesa d-lg-none" (click)="menuAbierto = true" aria-label="Abrir menú">
  <mat-icon>menu</mat-icon>
</button>

<!-- Fondo oscuro detrás del panel en móvil -->
<div class="overlay d-lg-none" *ngIf="menuAbierto" (click)="cerrarMovil()"></div>

<aside class="sidebar bg-principal" [class.colapsado]="colapsado" [class.abierto]="menuAbierto">

  <!-- Encabezado -->
  <div class="sidebar-header">
    <a routerLink="/inicio" class="brand" (click)="cerrarMovil()">
      <mat-icon>shopping_bag</mat-icon>
      <span *ngIf="!colapsado">PEDIDOS</span>
    </a>
    <button class="btn-icono d-none d-lg-inline-flex" (click)="colapsado = !colapsado" aria-label="Contraer menú">
      <mat-icon>{{ colapsado ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </div>

  <!-- Menú -->
  <div class="sidebar-body">
    <a routerLink="/inicio" routerLinkActive="activo" class="item" (click)="cerrarMovil()" title="Inicio">
      <mat-icon>home</mat-icon>
      <span *ngIf="!colapsado">Inicio</span>
    </a>

    <ng-container *ngFor="let grupo of grupos">
      <button class="item" (click)="toggleGrupo(grupo.titulo)" [title]="grupo.titulo">
        <mat-icon>{{ icono(grupo.titulo) }}</mat-icon>
        <span *ngIf="!colapsado" class="flex-grow-1 text-start">{{ grupo.titulo }}</span>
        <mat-icon *ngIf="!colapsado" class="flecha" [class.girada]="abiertos[grupo.titulo]">expand_more</mat-icon>
      </button>

      <div class="submenu" *ngIf="abiertos[grupo.titulo] && !colapsado">
        <a *ngFor="let op of grupo.opciones"
           [routerLink]="op.ruta"
           routerLinkActive="activo"
           class="subitem"
           (click)="cerrarMovil()">
          {{ op.titulo }}
        </a>
      </div>
    </ng-container>
  </div>

  <!-- Usuario -->
  <div class="sidebar-footer">
    <div class="usuario" *ngIf="!colapsado">
      <mat-icon>account_circle</mat-icon>
      <div class="lh-sm">
        <div class="fw-semibold">{{ auth.usuario?.nombre_usuario }}</div>
        <span class="badge bg-light text-dark">{{ auth.usuario?.rol }}</span>
      </div>
    </div>
    <button class="item" (click)="CerrarSesion()" title="Cerrar sesión">
      <mat-icon>logout</mat-icon>
      <span *ngIf="!colapsado">Cerrar sesión</span>
    </button>
  </div>
</aside>
