<div class="mb-4">
  <h1 class="h3 mb-1">Bienvenido, {{ auth.usuario?.nombre }} {{ auth.usuario?.apellidos }}</h1>
  <p class="text-muted mb-0">
    Rol: <span class="badge bg-principal">{{ auth.usuario?.rol }}</span>
  </p>
</div>

<div class="row g-3">
  <div class="col-12 col-md-6 col-lg-4" *ngFor="let grupo of grupos">
    <div class="card h-100">
      <div class="card-header fw-semibold">{{ grupo.titulo }}</div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let op of grupo.opciones">
          <a [routerLink]="op.ruta">{{ op.titulo }}</a>
          <span class="badge" [ngClass]="puedeEscribir(op.escribir) ? 'text-bg-success' : 'text-bg-light border'">
            {{ puedeEscribir(op.escribir) ? 'Editar' : 'Solo consulta' }}
          </span>
        </li>
      </ul>
    </div>
  </div>
</div>
