<h1 class="h4 mb-3">Actualizar Cliente</h1>

<div class="card">
  <div class="card-body">
    <form #f="ngForm" (ngSubmit)="updateUser(f)" [class.was-validated]="f.submitted" novalidate>
      <div class="row g-3">
        <div class="col-md-4 form-group">
          <label for="dni_cliente" class="form-label">DNI</label>
          <input type="text" id="dni_cliente" [(ngModel)]="user.dni_cliente" name="dni_cliente" class="form-control" readonly />
        </div>
        <div class="col-md-4 form-group">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" [(ngModel)]="user.nombre" name="nombre" class="form-control" maxlength="50" required />
          <div class="invalid-feedback">Digite el nombre</div>
        </div>
        <div class="col-md-4 form-group">
          <label for="apellido" class="form-label">Apellido</label>
          <input type="text" id="apellido" [(ngModel)]="user.apellido" name="apellido" class="form-control" maxlength="80" required />
          <div class="invalid-feedback">Digite el apellido</div>
        </div>
        <div class="col-md-4 form-group">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="text" id="telefono" [(ngModel)]="user.telefono" name="telefono" class="form-control" maxlength="20" />
        </div>
        <div class="col-md-4 form-group">
          <label for="email" class="form-label">Correo</label>
          <input type="email" id="email" [(ngModel)]="user.email" name="email" class="form-control" maxlength="100" email />
          <div class="invalid-feedback">Digite un correo válido</div>
        </div>
        <div class="col-md-4 form-group">
          <label for="fecha_nacimiento" class="form-label">Fecha nacimiento</label>
          <input type="date" id="fecha_nacimiento" [(ngModel)]="user.fecha_nacimiento" name="fecha_nacimiento" class="form-control" />
        </div>
        <div class="col-12 form-group">
          <label for="direccion" class="form-label">Dirección</label>
          <input type="text" id="direccion" [(ngModel)]="user.direccion" name="direccion" class="form-control" maxlength="200" />
        </div>
      </div>
      <button type="submit" class="btn btn-success mt-3 me-2">Actualizar</button>
      <a routerLink="/clientes" class="btn btn-outline-secondary mt-3">Cancelar</a>
    </form>
  </div>
</div>
