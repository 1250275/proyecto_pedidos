<h1 class="h4 mb-3">Registro de Cajas</h1>

<div class="card mb-4" *ngIf="puedeEscribir">
  <div class="card-body">
    <form #f="ngForm" (ngSubmit)="AgregarValor(f)" [class.was-validated]="f.submitted" novalidate>
      <div class="row g-3">
        <div class="col-md-4 form-group">
          <label for="monto_dinero" class="form-label">Monto de dinero</label>
          <input type="number" id="monto_dinero" [(ngModel)]="user.monto_dinero" name="monto_dinero"
            placeholder="DIGITE EL MONTO" class="form-control" min="0" step="0.01" required />
          <div class="invalid-feedback">Digite un monto mayor o igual a 0</div>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Agregar</button>
    </form>
  </div>
</div>

<app-barra-tabla [(filtro)]="filterPost" titulo="Cajas"></app-barra-tabla>

<div class="table-responsive">
  <table class="table table-bordered table-hover" id="tabla">
    <thead>
      <tr>
        <th>NO</th>
        <th>MONTO DE DINERO</th>
        <th *ngIf="puedeEscribir" class="no-export">ACCIONES</th>
      </tr>
    </thead>
    <tbody *ngIf="TUser | filtro: filterPost as filtrados">
      <tr *ngFor="let User of filtrados">
        <td>{{ User.id_caja }}</td>
        <td>L {{ User.monto_dinero | number: '1.2-2' }}</td>
        <td *ngIf="puedeEscribir" class="text-nowrap no-export">
          <button class="btn btn-success btn-sm me-1" [routerLink]="['/cajas/edit', User.id_caja]">Actualizar</button>
          <button *ngIf="esAdmin" class="btn btn-warning btn-sm" (click)="EliminarData(User.id_caja)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="filtrados.length === 0">
        <td colspan="3" class="text-center text-muted">{{ filterPost ? 'Sin resultados para la búsqueda' : 'No hay registros' }}</td>
      </tr>
    </tbody>
  </table>
</div>
