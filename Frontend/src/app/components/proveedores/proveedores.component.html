<h1 class="h4 mb-3">Registro de Proveedores</h1>

<div class="card mb-4" *ngIf="puedeEscribir">
  <div class="card-body">
    <form #f="ngForm" (ngSubmit)="AgregarValor(f)" [class.was-validated]="f.submitted" novalidate>
      <div class="row g-3">
        <div class="col-md-6 form-group">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" [(ngModel)]="user.nombre" name="nombre" placeholder="DIGITE EL NOMBRE"
            class="form-control" maxlength="100" required />
          <div class="invalid-feedback">Digite el nombre</div>
        </div>
        <div class="col-md-6 form-group">
          <label for="email" class="form-label">Correo</label>
          <input type="email" id="email" [(ngModel)]="user.email" name="email" placeholder="DIGITE EL CORREO"
            class="form-control" maxlength="100" email />
          <div class="invalid-feedback">Digite un correo válido</div>
        </div>
        <div class="col-md-6 form-group">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="text" id="telefono" [(ngModel)]="user.telefono" name="telefono"
            placeholder="DIGITE EL TELÉFONO" class="form-control" maxlength="20" />
        </div>
        <div class="col-md-6 form-group">
          <label for="n_cuenta" class="form-label">Número de cuenta</label>
          <input type="text" id="n_cuenta" [(ngModel)]="user.n_cuenta" name="n_cuenta"
            placeholder="DIGITE EL NÚMERO DE CUENTA" class="form-control" maxlength="30" />
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3">Agregar</button>
    </form>
  </div>
</div>

<app-barra-tabla [(filtro)]="filterPost" titulo="Proveedores"></app-barra-tabla>

<div class="table-responsive">
  <table class="table table-bordered table-hover" id="tabla">
    <thead>
      <tr>
        <th>NO</th>
        <th>NOMBRE</th>
        <th>TELÉFONO</th>
        <th>NÚMERO DE CUENTA</th>
        <th>CORREO</th>
        <th *ngIf="puedeEscribir" class="no-export">ACCIONES</th>
      </tr>
    </thead>
    <tbody *ngIf="TUser | filtro: filterPost as filtrados">
      <tr *ngFor="let User of filtrados">
        <td>{{ User.id_proveedor }}</td>
        <td>{{ User.nombre }}</td>
        <td>{{ User.telefono }}</td>
        <td>{{ User.n_cuenta }}</td>
        <td>{{ User.email }}</td>
        <td *ngIf="puedeEscribir" class="text-nowrap no-export">
          <button class="btn btn-success btn-sm me-1" [routerLink]="['/proveedores/edit', User.id_proveedor]">Actualizar</button>
          <button *ngIf="esAdmin" class="btn btn-warning btn-sm" (click)="EliminarData(User.id_proveedor, User.nombre)">Eliminar</button>
        </td>
      </tr>
      <tr *ngIf="filtrados.length === 0">
        <td colspan="6" class="text-center text-muted">{{ filterPost ? 'Sin resultados para la búsqueda' : 'No hay registros' }}</td>
      </tr>
    </tbody>
  </table>
</div>
